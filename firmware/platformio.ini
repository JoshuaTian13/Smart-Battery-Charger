[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit INA219@1.2.3
    milesburton/DallasTemperature@4.0.6
    paulstoffregen/OneWire@2.3.8
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
