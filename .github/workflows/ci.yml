name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run controller test
        run: make firmware-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ESP32 application
        run: |
          python -m pip install platformio==6.1.18
          pio run --project-dir firmware

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            infrastructure/requirements-dev.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run cloud, feature, and inference tests
        run: make python-test
      - name: Validate AWS SAM template
        run: |
          python -m pip install -r infrastructure/requirements-dev.txt
          cfn-lint infrastructure/template.yaml
      - name: Train reproducible demonstration model
        run: |
          python ml/generate_demo_data.py /tmp/battery-demo.csv --cycles 120
          python ml/train.py /tmp/battery-demo.csv --output-dir /tmp/model
          test -f /tmp/model/model.joblib
          test -f /tmp/model/metrics.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dashboard
        run: pnpm run build
